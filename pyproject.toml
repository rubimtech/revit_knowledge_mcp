[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "revit-knowledge-mcp"
version = "0.1.0"
description = "Unified MCP server: semantic search over Qdrant knowledge collections plus live Revit API documentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "qdrant-client>=1.9.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
revit-knowledge-mcp = "revit_knowledge_mcp.server:main"

[tool.setuptools.packages.find]
include = ["revit_knowledge_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
